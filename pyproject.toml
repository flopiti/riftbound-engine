[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "riftbound-engine"
version = "0.1.0"
description = "A minimal game engine prototype."
readme = "README.md"
requires-python = ">=3.11"  # uses enum.StrEnum (protocol.py), added in 3.11
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
