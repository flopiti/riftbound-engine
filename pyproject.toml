[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "riftbound-engine"
version = "0.1.0"
description = "A minimal game engine prototype."
readme = "README.md"
requires-python = ">=3.11"  # uses enum.StrEnum (protocol.py), added in 3.11
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
]
db = [
  "SQLAlchemy>=2.0",
  # Postgres driver (SQLite needs none). Install on the server for Postgres.
  "psycopg[binary]>=3.1",
  # Versioned, file-based schema migrations.
  "alembic>=1.13",
]

[tool.setuptools.packages.find]
# Only package the Python package; without this, flat-layout auto-discovery
# also picks up the sibling `decks/` data folder and refuses to build.
include = ["riftbound_engine*"]

[tool.pytest.ini_options]
pythonpath = ["."]
